<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farman Admin Panel</title>

<style>

body{
font-family:Arial;
background:#111;
color:white;
padding:20px;
}

h1{
text-align:center;
margin-bottom:30px;
font-size:40px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
color:black;
border-radius:10px;
overflow:hidden;
}

th,td{
border:1px solid #999;
padding:12px;
text-align:center;
}

th{
background:orange;
color:black;
font-size:20px;
}

tr:nth-child(even){
background:#f5f5f5;
}

a{
text-decoration:none;
color:blue;
font-weight:bold;
}

@media(max-width:768px){

table{
font-size:14px;
}

th,td{
padding:8px;
}

}

</style>

</head>

<body>

<h1>Farman Admin Panel</h1>

<table>

<thead>

<tr>
<th>Customer Name</th>
<th>Mobile Number</th>
<th>Repair Work</th>
<th>Location</th>
</tr>

</thead>

<tbody id="adminData">

<tr>
<td>Demo User</td>
<td>9876543210</td>
<td>Tyre Repair</td>
<td>
<a href="#" target="_blank">
Open Map
</a>
</td>
</tr>

</tbody>

</table>

</body>
</html>
